name: Windows release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable version tag, for example v0.2.0'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and prepare Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid stable version tag.' }
          $cargoVersion = ([regex]::Match((Get-Content apps/native/Cargo.toml -Raw),'(?m)^version = "([^"]+)"')).Groups[1].Value
          if ($env:RELEASE_TAG -ne ('v' + $cargoVersion)) { throw 'Tag and application version differ.' }
          if ((git rev-list -n 1 $env:RELEASE_TAG) -ne (git rev-parse HEAD)) { throw 'Tag must match the checked-out source.' }
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
          rustup default 1.97.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-rust1971-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-release-rust1971-
      - name: Test updater, library and Windows integration
        shell: pwsh
        run: |
          node --test scripts/sign-update.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Signing tests failed.' }
          cargo test -p game-library-native -p library-core -p platform-windows --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          cargo clippy -p game-library-native -p library-core -p platform-windows --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed.' }
      - name: Build Windows application
        shell: pwsh
        run: |
          cargo build -p game-library-native --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Fetch matching Vencord sources for distribution
        shell: pwsh
        run: |
          $manifest = Get-Content integrations/vencord/prebuilt/bundle.json -Raw | ConvertFrom-Json
          $source = Join-Path $env:GITHUB_WORKSPACE 'artifacts/vencord-release-source'
          git init $source
          git -C $source remote add origin https://github.com/Vendicated/Vencord.git
          git -C $source fetch --depth 1 origin $manifest.vencord_revision
          if ($LASTEXITCODE -ne 0) { throw 'Matching Vencord source fetch failed.' }
          git -C $source checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Vencord source checkout failed.' }
      - name: Sign, verify startup and publish complete release
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if (!$env:UPDATE_SIGNING_KEY) { throw 'UPDATE_SIGNING_KEY repository secret is missing.' }
          ./scripts/build-release.ps1 -Tag $env:RELEASE_TAG -VencordSource artifacts/vencord-release-source -Publish
      - name: Preserve release validation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-validation-${{ env.RELEASE_TAG }}
          path: |
            artifacts/releases/*/verified.json
            artifacts/releases/*/startup.json
            artifacts/releases/*/package.json
          if-no-files-found: ignore

[package]
name = "game-library"
version = "0.1.0"
edition = "2021"
default-run = "game-library"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
library-core = { path = "../../../crates/library-core" }
platform-windows = { path = "../../../crates/platform-windows" }
tauri = { version = "2.12.3", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-compat"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

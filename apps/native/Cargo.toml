[package]
name = "game-library-native"
version = "0.1.0"
edition = "2021"

[dependencies]
library-core = { path = "../../crates/library-core" }
platform-windows = { path = "../../crates/platform-windows" }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "system-tray", "raw-window-handle-06", "compat-1-18"] }
raw-window-handle = "0.6"
rfd = { version = "0.16", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3"

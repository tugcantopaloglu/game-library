[package]
name = "game-library-native"
version = "0.1.0"
edition = "2021"

[dependencies]
library-core = { path = "../../crates/library-core" }
platform-windows = { path = "../../crates/platform-windows" }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "system-tray", "raw-window-handle-06", "compat-1-18"] }
raw-window-handle = "0.6"
rfd = { version = "0.16", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
url = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
winreg = "0.55"
windows = { version = "0.62.2", features = ["Win32_Devices_FunctionDiscovery", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Media_DirectShow", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.18.1"
tauri-winres = "0.3.6"

[dev-dependencies]
tempfile = "3"
